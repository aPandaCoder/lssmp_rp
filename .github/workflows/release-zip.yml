name: Auto Release ZIP

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install converter dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            moreutils \
            jq \
            imagemagick \
            unzip \
            zip \
            nodejs \
            npm \
            uuid-runtime \
            ffmpeg \
            git

          sudo npm install --global spritesheet-js

      - name: Create Java ZIP
        run: |
          zip -r lssmp_rp.zip ./* -x "*.DS_Store"
          ls -lh lssmp_rp.zip

      - name: Download java2bedrock-sounds
        run: |
          git clone --depth 1 \
            https://github.com/MCCPF/java2bedrock-sounds.git \
            "$RUNNER_TEMP/java2bedrock-sounds"

          cp lssmp_rp.zip "$RUNNER_TEMP/java2bedrock-sounds/"

      - name: Convert Java pack to Bedrock
        run: |
          cd "$RUNNER_TEMP/java2bedrock-sounds"

          bash converter.sh lssmp_rp.zip \
            -w false \
            -f none

          test -f target/rp/manifest.json
          test -f target/bp/manifest.json
          test -f config.json

      - name: Package Bedrock resource pack
        run: |
          cd "$RUNNER_TEMP/java2bedrock-sounds/target/rp"
          zip -qr "$GITHUB_WORKSPACE/geyser_resources.mcpack" .

      - name: Package Bedrock behavior pack
        run: |
          cd "$RUNNER_TEMP/java2bedrock-sounds/target/bp"
          zip -qr "$GITHUB_WORKSPACE/geyser_behavior.mcpack" .

      - name: Export Geyser mappings
        run: |
          cp "$RUNNER_TEMP/java2bedrock-sounds/config.json" \
            geyser_mappings.json

      - name: Check generated files
        run: |
          ls -lh \
            lssmp_rp.zip \
            geyser_resources.mcpack \
            geyser_behavior.mcpack \
            geyser_mappings.json

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          files: |
            lssmp_rp.zip
            geyser_resources.mcpack
            geyser_behavior.mcpack
            geyser_mappings.json
